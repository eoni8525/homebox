<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>우리집 보관함</title>
<meta name="description" content="상자에 QR 라벨을 붙이고, 어디에 무엇이 있는지 폰으로 찾는 집 정리 앱. 옷·장난감·계절용품·공구까지. 기록은 내 폰에만 저장돼요.">
<meta name="theme-color" content="#f6f5f2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#f6f5f2;--card:#fff;--fg:#25242a;--muted:#6c6973;--line:#e7e4de;--field:#f0eee9;--accent:#2d6e68;--accent-2:#e4f0ee;--bad:#c63c3c;--good:#2f8a4e;--r:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 10px rgba(0,0,0,.04)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Pretendard","Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
@media (min-width:700px){html{font-size:17px}body{font-size:17px}}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:620px;margin:0 auto;padding:0 14px}
main.wrap{padding-bottom:70px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:8px;height:54px}
header.top h1{font-size:19px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{border:0;background:transparent;font-size:20px;width:40px;height:40px;border-radius:10px;display:grid;place-items:center}
.iconbtn:active{background:var(--field)}
.back{border:0;background:transparent;color:var(--accent);font-size:16px;padding:8px 4px}
.search{position:relative;margin:12px 0 4px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px 12px 40px;font-size:16px}
.search input:focus{outline:2px solid var(--accent);border-color:transparent}
.search::before{content:"⌕";position:absolute;left:14px;top:50%;transform:translateY(-52%);font-size:20px;color:var(--muted)}
h2.sec{font-size:15px;color:var(--muted);margin:18px 2px 8px;display:flex;align-items:center;gap:8px}
h2.sec .cnt{font-weight:400}
h2.sec .more{margin-left:auto;border:0;background:transparent;color:var(--accent);font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.boxrow{display:flex;align-items:stretch;gap:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);margin-bottom:8px;overflow:hidden;border:0;width:100%;text-align:left;padding:0}
.boxrow .bar{width:58px;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:18px;letter-spacing:-.5px}
.boxrow .tx{padding:10px 12px;min-width:0;flex:1}
.boxrow b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boxrow .sum{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.boxrow .n{padding:10px 14px 10px 0;align-self:center;color:var(--muted);font-size:14px;white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:14px}
.btn{border:0;border-radius:12px;padding:12px 14px;background:var(--accent);color:#fff;font-weight:700;font-size:15px}
.btn.ghost{background:var(--card);color:var(--accent);border:1px solid var(--line);font-weight:600}
.btn.soft{background:var(--accent-2);color:var(--accent)}
.btn.bad{background:#fbeaea;color:var(--bad)}
.btn.wide{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,1fr)}}
.it{border:0;padding:0;background:var(--card);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.ph{aspect-ratio:1;background:var(--field);display:grid;place-items:center;color:#b3afa7;font-size:30px;overflow:hidden;position:relative}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.it .cap{padding:6px 8px 8px;font-size:13px;line-height:1.35}
.it .cap b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .cap span{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.list .row{display:flex;gap:10px;align-items:center;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:8px;margin-bottom:8px;border:0;width:100%;text-align:left}
.list .row .ph{width:56px;flex:none;border-radius:9px;font-size:20px}
.list .row .tx{min-width:0;flex:1}
.list .row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .row span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.loc{display:inline-flex!important;align-items:center;gap:4px;background:var(--field);color:var(--fg)!important;border-radius:999px;padding:1px 9px;font-size:12.5px!important;margin-top:3px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.filters{display:flex;flex-direction:column;gap:6px;margin:8px 0 10px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:flex;height:62px;padding:0 4px}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11.5px;color:var(--muted)}
nav.tabs button .i{font-size:21px;line-height:1}
nav.tabs button[aria-current=page]{color:var(--accent);font-weight:700}
nav.tabs button.add .i{width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:28px;margin-top:-18px;box-shadow:0 4px 12px rgba(45,110,104,.35)}
.fab{position:fixed;right:max(16px,calc(50% - 294px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:25;border:0;border-radius:999px;background:#25242a;color:#fff;font-weight:700;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25);display:flex;gap:6px;align-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(20,20,24,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:6px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#d4d0c8;margin:4px auto 8px}
.sheet h3{margin:4px 0 12px;font-size:18px;display:flex;align-items:center}
.sheet h3 .x{margin-left:auto}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.f>label,.f>.lb{font-size:13px;color:var(--muted)}
.f input[type=text],.f input[type=date],.f input[type=number],.f select,.f textarea,.inp{width:100%;border:1px solid transparent;background:var(--field);border-radius:10px;padding:11px 12px;font-size:16px}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{outline:none;border-color:var(--accent);background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo-pick{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.photo-pick .ph{width:96px;border-radius:12px;flex:none}
.photo-pick .btns{flex-direction:column;flex:1}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:38px;height:38px;border-radius:10px;border:3px solid transparent}
.colors button[aria-pressed=true]{border-color:#25242a;box-shadow:inset 0 0 0 2px #fff}
.boxhead{border-radius:var(--r);color:#fff;padding:16px;margin-top:12px;display:flex;gap:14px;align-items:center}
.boxhead .code{font-size:34px;font-weight:800;line-height:1;letter-spacing:-1px}
.boxhead .nm{font-size:19px;font-weight:700}
.boxhead .rm{opacity:.9;font-size:14px}
.big-ph{border-radius:var(--r);overflow:hidden;background:var(--field);aspect-ratio:4/3;display:grid;place-items:center;color:#b3afa7;font-size:48px}
.big-ph img{width:100%;height:100%;object-fit:contain;background:#111}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 10px;margin:12px 0;font-size:15px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{background:var(--accent-2);color:#1f514d;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.warn{background:#fff4e0;color:#7a4b00;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;display:flex;gap:8px;align-items:center}
.warn button{margin-left:auto;white-space:nowrap}
.msg{font-size:13.5px;color:var(--muted);min-height:1em;margin-top:6px}
.setcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:12px 0}
.setcard h4{margin:0 0 4px;font-size:16px}
.setcard p{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.tagrow{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.tagrow input{flex:1}
.tagrow button{border:0;background:var(--field);border-radius:8px;padding:9px 10px;font-size:13px}
.ver{color:var(--muted);text-align:center;font-size:13px;margin:18px 0}
.stat{display:flex;gap:8px;margin:10px 0}
.stat div{flex:1;background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:12.5px;color:var(--muted)}
.scan-bg{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column}
.scan-bg video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan-bg .frame{position:absolute;left:50%;top:42%;width:64vmin;height:64vmin;transform:translate(-50%,-50%);border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
.scan-bg .bar{padding:14px 16px calc(14px + env(safe-area-inset-bottom));color:#fff;display:flex;align-items:center;gap:10px;background:#000;z-index:1}
.scan-bg .bar p{flex:1;margin:0;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#25242a;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:80;max-width:90vw;text-align:center}
.sel-list .opt{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.sel-list .room{font-size:13px;color:var(--muted);margin:12px 0 2px}
.lblpick .opt{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lblpick input{width:20px;height:20px}
#printArea{display:none}
.lockbg{position:fixed;inset:0;z-index:95;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.lockbox{width:100%;max-width:340px;text-align:center}
.lockbox .ic{font-size:40px;margin-bottom:6px}
.lockbox h2{margin:0 0 6px;font-size:21px}
.lockbox p{color:var(--muted);font-size:14px;margin:0 0 14px}
.lockbox input{width:100%;text-align:center;font-size:22px;letter-spacing:6px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px}
.lockbox input:focus{outline:2px solid var(--accent);border-color:transparent}
.lockbox .link{border:0;background:transparent;color:var(--muted);font-size:13.5px;text-decoration:underline;margin-top:12px;padding:6px}
.lockbox .err{color:var(--bad);font-size:14px;min-height:1.4em}
.airow{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.airow input[type=checkbox]{width:20px;height:20px;flex:none}
.airow canvas,.airow .ph{width:52px;height:52px;border-radius:8px;flex:none;object-fit:cover;background:var(--field)}
.airow .fs{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.airow .fs input,.airow .fs select{width:100%;border:1px solid transparent;background:var(--field);border-radius:8px;padding:7px 9px;font-size:15px}
.spin{display:inline-block;width:18px;height:18px;border:3px solid var(--accent-2);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff;padding:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
}
.sheetp{display:grid;gap:4mm;grid-template-columns:repeat(2,1fr)}
.sheetp.s3{grid-template-columns:repeat(3,1fr)}
.lab{border:1px solid #999;border-radius:3mm;overflow:hidden;break-inside:avoid;display:flex;flex-direction:column;font-family:inherit}
.lab .lt{color:#fff;display:flex;align-items:center;gap:3mm;padding:2mm 3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.lab .lt b{font-size:22pt;line-height:1;letter-spacing:-.5pt}
.lab .lt span{font-size:9pt;opacity:.95}
.lab .lb{display:flex;gap:3mm;padding:2.5mm 3mm;align-items:center}
.lab .lb svg{width:30mm;height:30mm;flex:none}
.lab .lb .t{font-size:12pt;font-weight:700;line-height:1.25;word-break:keep-all}
.lab .lb .t small{display:block;font-size:8.5pt;font-weight:400;color:#555;margin-top:1.5mm}
.sheetp.s3 .lab .lt b{font-size:16pt}
.sheetp.s3 .lab .lb svg{width:22mm;height:22mm}
.sheetp.s3 .lab .lb .t{font-size:9.5pt}
.preview{background:#fff;border-radius:12px;padding:10px;box-shadow:var(--shadow);margin:10px 0;zoom:.62}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="topbar"></div></header>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" type="button" hidden><span aria-hidden="true">⌗</span> QR 찍기</button>
<nav class="tabs" aria-label="화면"><div class="wrap">
  <button type="button" data-tab="home"><span class="i" aria-hidden="true">⌂</span>수납함</button>
  <button type="button" data-tab="items"><span class="i" aria-hidden="true">▦</span>물건 전체</button>
  <button type="button" data-tab="add" class="add" aria-label="물건 추가"><span class="i" aria-hidden="true">+</span>추가</button>
  <button type="button" data-tab="gone"><span class="i" aria-hidden="true">♺</span>정리함</button>
  <button type="button" data-tab="settings"><span class="i" aria-hidden="true">⚙</span>설정</button>
</div></nav>
<input type="file" id="fileOne" accept="image/*" hidden>
<input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fileMany" accept="image/*" multiple hidden>
<input type="file" id="fileBackup" accept="application/json,.json" hidden>
<div id="printArea"></div>
<script src="qrcode.js"></script>
<script>
(function(){
'use strict';
const VERSION='2026.11.24-2208';
const PREVIEW='0'==='1'; // Claude 미리보기: 카메라·인쇄·파일 내려받기가 막혀 있음
const $=id=>document.getElementById(id);
const el=(tag,attrs,...kids)=>{const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='html')e.innerHTML=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else e.setAttribute(k,v===true?'':v)}kids.flat().forEach(c=>{if(c==null||c===false)return;e.append(c.nodeType?c:String(c))});return e};
const uid=()=>Date.now().toString(36).slice(-5)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const won=n=>(Number(n)||0).toLocaleString('ko-KR')+'원';

const COLORS=[['red','빨강','#df4a4f'],['orange','주황','#e9822a'],['yellow','노랑','#d9a514'],['green','초록','#2f9a57'],['blue','파랑','#3478d4'],['purple','보라','#7f56d9'],['pink','분홍','#d9558f'],['gray','회색','#6f7680']];
const colorOf=k=>(COLORS.find(c=>c[0]===k)||COLORS[7]);
const CATS=['옷','신발·가방','이불·패브릭','장난감','책·문구','주방용품','생활용품','계절용품','공구·캠핑','전자기기','서류·추억','기타'];
const OLD_CLOTHES=['상의','하의','원피스·세트','아우터','니트·가디건','속옷·잠옷','양말·스타킹','모자·소품']; // 옷장 앱 시절 종류 → '옷'
const SEASONS=['봄','여름','가을','겨울'];
const EXITS=[['give','기증'],['sell','판매'],['hand','물려줌'],['trash','버림'],['etc','기타']];
const exitName=k=>(EXITS.find(e=>e[0]===k)||EXITS[4])[1];

// ---------- 저장소 (IndexedDB: 이 폰 안에만) ----------
let DBP=null;
function openDB(){if(DBP)return DBP;DBP=new Promise((res,rej)=>{const r=indexedDB.open('closet',1);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('kv'))d.createObjectStore('kv');if(!d.objectStoreNames.contains('photos'))d.createObjectStore('photos')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});return DBP}
const P=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function store(name,mode){const d=await openDB();return d.transaction(name,mode||'readonly').objectStore(name)}
const kvGet=async k=>P((await store('kv')).get(k));
const kvSet=async(k,v)=>P((await store('kv','readwrite')).put(v,k));
const phGet=async id=>P((await store('photos')).get(id));
const phSet=async(id,v)=>P((await store('photos','readwrite')).put(v,id));
const phDel=async id=>P((await store('photos','readwrite')).delete(id));

const BLANK=()=>({v:1,name:'우리집 보관함',rooms:[],boxes:[],items:[],people:[],seq:0,lastBackup:0,deleted:{}});
const tomb=id=>{S.deleted=S.deleted||{};S.deleted[id]=Date.now()};
let S=BLANK();
let saveT=null;
function changed(){clearTimeout(saveT);saveT=setTimeout(save,300)}
async function save(){try{await kvSet('state',JSON.parse(JSON.stringify(S)))}catch(e){toast('저장하지 못했어요: '+(e&&e.message||e))}}
window.addEventListener('pagehide',()=>{if(saveT){clearTimeout(saveT);save()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&saveT){clearTimeout(saveT);save()}});

// ---------- 사진 ----------
const urlCache=new Map();
async function thumbURL(id,full){const key=id+(full?':f':'');if(urlCache.has(key))return urlCache.get(key);const r=await phGet(id).catch(()=>null);if(!r)return null;const b=full?(r.full||r.thumb):(r.thumb||r.full);if(!b)return null;const u=URL.createObjectURL(b);urlCache.set(key,u);return u}
function fillPhotos(root){root.querySelectorAll('img[data-ph]').forEach(async img=>{const u=await thumbURL(img.dataset.ph,img.dataset.full==='1');if(u){img.src=u;img.hidden=false}})}
function phEl(photoId,full,fallback){const box=el('div',{class:'ph'});if(photoId){const i=el('img',{alt:'','data-ph':photoId,'data-full':full?'1':null,hidden:true});box.append(i)}else box.append(fallback||'🏷️');return box}

async function mergeState(st,photos){
  const del=Object.assign({},S.deleted||{},st.deleted||{});let added=0,changed=0,removed=0;
  const known=new Set([...S.rooms,...S.boxes,...S.items].map(x=>x.id));
  const mergeArr=(a,b)=>{const m=new Map();a.forEach(x=>{if(del[x.id]){removed++;return}m.set(x.id,x)});(b||[]).forEach(x=>{if(del[x.id])return;const o=m.get(x.id);if(!o){m.set(x.id,x);if(!known.has(x.id))added++}else if((x.updated||0)>(o.updated||0)){m.set(x.id,x);changed++}});return [...m.values()]};
  for(const x of [...(st.items||[]),...(st.boxes||[])])if(x.photoId&&!photos[x.photoId]&&!await phGet(x.photoId).catch(()=>null))x.photoId='';
  S.rooms=mergeArr(S.rooms,st.rooms);S.boxes=mergeArr(S.boxes,st.boxes);S.items=mergeArr(S.items,st.items);
  S.people=[...new Set([...(S.people||[]),...(st.people||[])])];
  let seq=Math.max(S.seq||0,st.seq||0);const seen=new Set();S.boxes.slice().sort((a,b)=>(a.updated||0)-(b.updated||0)).forEach(b=>{if(seen.has(b.code))b.code=++seq;seen.add(b.code)});S.seq=Math.max(seq,...S.boxes.map(b=>b.code),0);
  S.deleted=del;return {added,changed,removed};
}

  const go=async()=>{if(await pinOK(a.value.trim())){done();return}tries++;err.textContent='비밀번호가 달라요.'+(tries>=3?' 잊었다면 아래를 눌러 주세요.':'');a.value='';a.focus()};
  a.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();go()}});
  const forgot=el('button',{class:'link',type:'button',onclick:()=>{forgot.replaceWith(el('div',{class:'warn',style:'text-align:left;flex-direction:column;align-items:stretch'},el('span',{},'비밀번호는 찾을 수 없어요. 이 폰의 기록과 사진을 모두 지우고 새로 시작할 수 있어요. 백업 파일이 있으면 그다음에 불러오면 돼요.'),wipeBtn))}},'비밀번호를 잊었어요');
  const wipeBtn=el('button',{class:'btn bad',type:'button',onclick:async()=>{if(!wipeBtn.dataset.sure){wipeBtn.dataset.sure='1';wipeBtn.textContent='한 번 더 누르면 모두 지워져요';return}try{const d=await openDB();await P(d.transaction('photos','readwrite').objectStore('photos').clear());await kvSet('state',BLANK())}catch(e){}try{localStorage.removeItem(LOCKK)}catch(e){}location.reload()}},'모두 지우고 새로 시작');
  box.append(el('div',{class:'ic'},'🔒'),el('h2',{},S.name),el('p',{},'비밀번호를 넣어 주세요'),a,err,el('button',{class:'btn wide',type:'button',onclick:go},'열기'),forgot);
  document.body.append(bg);setTimeout(()=>a.focus(),60);
}
async function lockChange(msg){const cur=await askText('지금 비밀번호','지금 쓰는 비밀번호',{pw:1,ok:'확인'});if(cur==null)return;if(!await pinOK(cur)){msg.textContent='지금 비밀번호가 달라요.';return}const L=lockGet();lockSet({on:false,old:L});lockScreen('setup');const t=setInterval(()=>{if(lockOpen)return;clearInterval(t);const n=lockGet();if(!n||!n.on){lockSet(L);msg.textContent='바꾸지 않았어요.'}else msg.textContent='비밀번호를 바꿨어요.';},300)}
async function lockOff(msg){const cur=await askText('잠금 끄기','지금 비밀번호',{pw:1,ok:'잠금 끄기'});if(cur==null)return;if(!await pinOK(cur)){msg.textContent='비밀번호가 달라요.';return}lockSet({on:false});toast('잠금을 껐어요');render()}
document.addEventListener('visibilitychange',()=>{if(PREVIEW)return;if(document.hidden){hiddenAt=Date.now();return}const L=lockGet();if(L&&L.on&&hiddenAt&&Date.now()-hiddenAt>180000){sheetStack.slice().forEach(c=>c());lockScreen('unlock')}});

// ---------- AI로 한 번에 넣기 (Claude API, 각자 키) ----------
const AIK='homebox-ai-key';
function aiKey(v){try{if(v===undefined)return localStorage.getItem(AIK)||'';if(v)localStorage.setItem(AIK,v);else localStorage.removeItem(AIK)}catch(e){}return ''}
const AI_SCHEMA={type:'object',additionalProperties:false,required:['items'],properties:{items:{type:'array',items:{type:'object',additionalProperties:false,required:['name','cat','size','season','box'],properties:{
  name:{type:'string'},cat:{type:'string',enum:CATS},size:{type:'string'},season:{type:'array',items:{type:'string',enum:SEASONS}},box:{type:'array',items:{type:'integer'}}}}}}};
const AI_PROMPT='이 사진은 집 정리용 수납함(상자·서랍·선반) 안이나, 바닥에 펼쳐 놓은 물건이에요. 보이는 물건을 하나씩 찾아 목록으로 만들어 주세요.\n'+
  '- name: 한국어로 짧고 구체적으로(색·종류·특징, 예: "남색 롱패딩", "레고 듀플로 블록", "크리스마스 트리 전구"). 같은 물건이 여러 개면 "흰 양말 5켤레"처럼 하나로 묶어요.\n'+
  '- cat: 주어진 목록 중 가장 알맞은 것 하나.\n- size: 옷·신발 라벨에 사이즈가 보일 때만 적고, 아니면 빈 문자열.\n- season: 계절 옷이나 계절용품일 때만(예: 패딩은 겨울), 아니면 빈 배열.\n'+
  '- box: 그 물건이 보이는 영역 [왼쪽, 위, 오른쪽, 아래]. 사진 전체를 가로·세로 0~1000으로 본 정수.\n'+
  '물건이 아닌 것(상자 자체, 바닥, 손)은 빼고, 무엇인지 확실하지 않은 것도 빼요. 최대 30개.';
async function aiStart(boxId){
  if(PREVIEW){toast('미리보기에서는 AI가 안 돼요. 실제 앱에서 할 수 있어요');return}
  const key=aiKey();
  if(!key){sheet('AI로 한 번에 넣기',(sh,close)=>{sh.append(el('p',{style:'margin:0 0 12px'},'이 기능은 Anthropic API 키가 있어야 써요. 설정 → "AI로 한 번에 넣기"에 키를 넣어 주세요. 키가 없으면 "사진 여러 장으로 한 번에 넣기"로 직접 넣을 수 있어요.'),el('button',{class:'btn wide',type:'button',onclick:()=>{close();tabGo('settings')}},'설정으로 가기'))});return}
  const f=(await pickFile($('fileOne')))[0];if(!f)return;
  let img;try{img=await loadImg(f)}catch(e){toast(String(e.message||e));return}
  const small=document.createElement('canvas');{const s=Math.min(1,1280/Math.max(img.naturalWidth,img.naturalHeight));small.width=Math.round(img.naturalWidth*s);small.height=Math.round(img.naturalHeight*s);small.getContext('2d').drawImage(img,0,0,small.width,small.height)}
  const data=small.toDataURL('image/jpeg',.85).split(',')[1];
  const status=el('p',{style:'margin:6px 0'},el('span',{class:'spin','aria-hidden':'true'}),'AI가 사진 속 물건을 찾고 있어요… (10~40초)');
  const closeWait=sheet('AI가 찾는 중',sh=>{const pv=el('img',{src:small.toDataURL('image/jpeg',.7),alt:'',style:'width:100%;border-radius:12px;max-height:40vh;object-fit:contain;background:#111'});sh.append(pv,status)});
  let items;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2026-10-21','anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',output_config:{effort:'low',format:{type:'json_schema',schema:AI_SCHEMA}},
        messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:'image/jpeg',data}},{type:'text',text:AI_PROMPT}]}]})});
    const j=await res.json().catch(()=>null);
    if(!res.ok){const t=j&&j.error&&j.error.type;throw new Error(res.status===401?'API 키가 맞지 않아요. 설정에서 키를 확인해 주세요.':res.status===429?'잠깐 요청이 많아요. 1분 뒤 다시 해 주세요.':t==='invalid_request_error'&&/credit/i.test(j.error.message||'')?'API 잔액이 부족해요. console.anthropic.com에서 충전해 주세요.':'AI 요청이 실패했어요 ('+res.status+(j&&j.error&&j.error.message?': '+j.error.message:'')+')')}
    if(j.stop_reason==='refusal')throw new Error('AI가 이 사진은 분석하지 않았어요. 다른 사진으로 해 주세요.');
    const tb=(j.content||[]).find(c=>c.type==='text');if(!tb)throw new Error('AI 답을 읽지 못했어요. 다시 해 주세요.');
    items=(JSON.parse(tb.text).items||[]).slice(0,30);
  }catch(e){status.textContent=String(e&&e.message||e).replace(/^TypeError: Failed to fetch$/,'인터넷 연결을 확인해 주세요.');return}
  closeWait();
  if(!items.length){sheet('찾은 물건이 없어요',sh=>sh.append(el('p',{},'사진에서 물건을 찾지 못했어요. 물건이 잘 보이게 밝은 곳에서 다시 찍어 주세요.')));return}
  aiReview(img,items,boxId);
}
function aiCrop(img,bx){const W=img.naturalWidth,H=img.naturalHeight;let [x0,y0,x1,y1]=(bx&&bx.length===4?bx:[0,0,1000,1000]).map(Number);if(!(x1>x0&&y1>y0)){x0=0;y0=0;x1=1000;y1=1000}
  const px=(x1-x0)*.08,py=(y1-y0)*.08;x0=Math.max(0,x0-px);y0=Math.max(0,y0-py);x1=Math.min(1000,x1+px);y1=Math.min(1000,y1+py);
  const sx=x0/1000*W,sy=y0/1000*H,sw=Math.max(8,(x1-x0)/1000*W),sh=Math.max(8,(y1-y0)/1000*H);const s=Math.min(1,1280/Math.max(sw,sh));
  const c=document.createElement('canvas');c.width=Math.round(sw*s);c.height=Math.round(sh*s);c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c}
function aiReview(img,items,boxId){
  const rows=items.map(it=>({on:true,name:String(it.name||'').slice(0,40),cat:CATS.includes(it.cat)?it.cat:'기타',size:String(it.size||'').slice(0,12),season:(it.season||[]).filter(x=>SEASONS.includes(x)),crop:aiCrop(img,it.box)}));
  const d={boxId:boxId||'',owner:'',asBoxPhoto:true};
  sheet('AI가 찾은 물건 '+rows.length+'개',(sh,close)=>{
    sh.append(el('p',{class:'msg',style:'margin:0 0 6px'},'맞는 것만 체크하고, 이름·종류를 고쳐서 넣어요. 사진은 물건마다 잘라서 저장돼요.'));
    const list=el('div');rows.forEach(r=>{const cb=el('input',{type:'checkbox',checked:true,'aria-label':'넣기',onchange:()=>{r.on=cb.checked;cnt()}});const th=r.crop.cloneNode();th.getContext('2d').drawImage(r.crop,0,0);
      const nm=el('input',{type:'text',value:r.name,maxlength:'40','aria-label':'이름',oninput:()=>r.name=nm.value});const sel=el('select',{'aria-label':'종류',onchange:()=>r.cat=sel.value});CATS.forEach(c=>sel.append(el('option',{value:c,selected:c===r.cat?true:null},c)));
      list.append(el('label',{class:'airow'},cb,th,el('div',{class:'fs'},nm,sel)))});
    sh.append(list);
    if(S.people.length)sh.append(el('div',{class:'f',style:'margin-top:12px'},el('div',{class:'lb'},'누구 것 (모두에게)'),chipPick([...S.people,'공용'],'',false,v=>d.owner=v)));
    sh.append(el('div',{class:'f',style:'margin-top:12px'},el('div',{class:'lb'},'어디에 두나요'),boxSelect(d.boxId,v=>{d.boxId=v;bp.hidden=!v})));
    const bpc=el('input',{type:'checkbox',checked:true,onchange:()=>d.asBoxPhoto=bpc.checked});const bp=el('label',{class:'airow',style:'border:0'},bpc,el('span',{},'이 사진을 수납함의 "상자 속 사진"으로도 저장'));bp.hidden=!d.boxId;sh.append(bp);
    const msg=el('div',{class:'msg'});
    const go=el('button',{class:'btn wide',type:'button',style:'margin-top:10px',onclick:async()=>{const pick=rows.filter(r=>r.on);if(!pick.length)return;go.disabled=true;let n=0;
      for(const r of pick){msg.textContent='저장하는 중… '+(++n)+'/'+pick.length;const pid=await savePhotoFrom(r.crop);S.items.push({id:'i'+uid(),status:'keep',created:Date.now(),updated:Date.now(),name:r.name.trim(),cat:r.cat,owner:d.owner,size:r.size,brand:'',season:r.season,boxId:d.boxId,memo:'',photoId:pid})}
      const b=boxOf(d.boxId);if(b&&d.asBoxPhoto){const old=b.photoId;b.photoId=await savePhotoFrom(img);b.updated=Date.now();if(old)dropPhoto(old)}
      changed();close();render();toast(pick.length+'개를 넣었어요')}});
    const cnt=()=>{const k=rows.filter(r=>r.on).length;go.textContent=k?k+'개 넣기':'넣을 것을 골라 주세요';go.disabled=!k};cnt();
    sh.append(go,msg);
  });
}
